# 1) Copy the PNGs into your Flutter project, e.g. assets/icon/
# 2) Add to pubspec.yaml:

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

# 3) Run:
#    dart run flutter_launcher_icons
#
# Google Play listing icon: play_store_512.png (upload in Play Console).
